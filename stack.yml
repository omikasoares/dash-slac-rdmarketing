version: "3.7"

services:

  dash-slac-rdmarketing:
    image: dash-slac-rdmarketing:latest

    networks:
      - AutzNet

    environment:
      - TZ=America/Sao_Paulo
      - PORT=3000
      - RD_CLIENT_ID=${RD_CLIENT_ID}
      - RD_CLIENT_SECRET=${RD_CLIENT_SECRET}
      - RD_REFRESH_TOKEN=${RD_REFRESH_TOKEN}
      - RD_MAX_REQUESTS_PER_MINUTE=${RD_MAX_REQUESTS_PER_MINUTE}
      - DASHBOARD_USER=${DASHBOARD_USER}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - CRM_SHEET_ID=${CRM_SHEET_ID}
      - SHEET_SYNC_INTERVAL_MINUTES=${SHEET_SYNC_INTERVAL_MINUTES}

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.dash-slac-rdmarketing.rule=Host(`slac.autz.com.br`)
        - traefik.http.services.dash-slac-rdmarketing.loadbalancer.server.port=3000
        - traefik.http.routers.dash-slac-rdmarketing.service=dash-slac-rdmarketing
        - traefik.http.routers.dash-slac-rdmarketing.tls.certresolver=letsencryptresolver
        - traefik.http.routers.dash-slac-rdmarketing.entrypoints=websecure
        - traefik.http.routers.dash-slac-rdmarketing.tls=true

networks:
  AutzNet:
    external: true
    name: AutzNet
